<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img"><title>Connected technologies and components</title><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#24515b" stroke-opacity=".12"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" rx="20" fill="#071219"/><rect width="100%" height="100%" rx="20" fill="url(#grid)"/><style>
text{font-family:Inter,'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,monospace}.eyebrow{fill:#61ead1;font-size:12px;font-weight:700;letter-spacing:2px}.title{fill:#eaf5f4;font-size:44px;font-weight:700}.head{fill:#eaf5f4;font-size:20px;font-weight:650}.body{fill:#a9bdc0;font-size:14px}.label{fill:#a9bdc0;font-size:10px;letter-spacing:1.4px}.panel{fill:#0d2029;stroke:#24515b;stroke-width:1.2;transition:stroke .22s ease,filter .22s ease,fill .22s ease}.wire{fill:none;stroke:#61ead1;stroke-opacity:.5;stroke-width:1.3;stroke-dasharray:5 9;animation:flow 12s linear infinite}.node{transform-box:fill-box;transform-origin:center;animation:float 7s ease-in-out infinite;cursor:pointer}.node:nth-of-type(2n){animation-delay:-2s}.node:nth-of-type(3n){animation-delay:-4s}.node:hover .panel{stroke:#61ead1;stroke-width:2;fill:#102b34;filter:url(#glow)}.node:hover .orb{filter:url(#glow);r:7}.node:hover text{fill:#eaf5f4}.node:hover .wire{stroke-opacity:1;stroke-width:2}@keyframes flow{to{stroke-dashoffset:-112}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
