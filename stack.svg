<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img">
<title>Technology and interface components in Shiya Companion</title>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#25404a" stroke-opacity=".16" stroke-width=".6"/></pattern>
</defs>
<rect width="1200" height="280" rx="20" fill="#09141b"/>
<rect width="1200" height="280" rx="20" fill="url(#grid)"/>

<style>
  text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
  .eyebrow { fill: #59e0c4; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .title { fill: #eaf2f3; font-size: 46px; font-weight: 700; letter-spacing: -1.2px; }
  .heading { fill: #eaf2f3; font-size: 24px; font-weight: 650; }
  .body { fill: #a1b3b9; font-size: 15px; }
  .label { fill: #a1b3b9; font-size: 11px; letter-spacing: 1.4px; }
  .chip { fill: #0d1b23; stroke: #25404a; stroke-width: 1; }
  .panel { fill: #10222b; stroke: #25404a; stroke-width: 1; }
  .teal { fill: #59e0c4; }
  .blue { fill: #69baff; }
  .lime { fill: #b6e36a; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
  .pulse-late { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
</style>


<g fill="none" stroke="#59e0c4" stroke-width="1" opacity=".22">
  <path d="M664 42L760 98L854 54L949 111L1068 58L1150 105"/>
  <path d="M664 42L684 174L782 225L854 54L880 207L949 111L1033 230L1068 58L1150 105L1140 224"/>
  <path d="M684 174L782 225L880 207L1033 230L1140 224"/>
</g>
<g fill="#59e0c4" opacity=".75">
  <circle cx="664" cy="42" r="3"/><circle cx="760" cy="98" r="2.5"/>
  <circle cx="854" cy="54" r="3.2" class="pulse"/><circle cx="949" cy="111" r="2.5"/>
  <circle cx="1068" cy="58" r="3" class="pulse-late"/><circle cx="1150" cy="105" r="2.5"/>
  <circle cx="684" cy="174" r="2.5"/><circle cx="782" cy="225" r="3"/>
  <circle cx="880" cy="207" r="2.5"/><circle cx="1033" cy="230" r="3.2" class="pulse"/>
  <circle cx="1140" cy="224" r="2.5"/>
</g>

<rect x="14" y="14" width="1172" height="252" rx="16" fill="none" stroke="#25404a" stroke-width="1"/>

<text x="48" y="57" class="eyebrow">TOOLS &amp; COMPONENTS</text>
<text x="48" y="96" class="heading">A focused, visible stack.</text>
<text x="48" y="128" class="body">Based on files in the public Shiya Companion repository.</text>
<path d="M210 205H474M570 205H834" fill="none" stroke="#25404a" stroke-width="2"/>
<path d="M210 205H474M570 205H834" fill="none" stroke="#59e0c4" stroke-opacity=".55" stroke-width="1" stroke-dasharray="5 8"/>
<g transform="translate(72 169)"><rect width="284" height="72" rx="10" class="panel"/><circle cx="24" cy="36" r="6" class="teal pulse"/><text x="46" y="33" class="label">LANGUAGE</text><text x="46" y="54" class="mono" fill="#eaf2f3" font-size="16">TypeScript</text></g>
<g transform="translate(426 169)"><rect width="284" height="72" rx="10" class="panel"/><circle cx="24" cy="36" r="6" class="blue pulse-late"/><text x="46" y="33" class="label">STRUCTURE</text><text x="46" y="54" class="mono" fill="#eaf2f3" font-size="16">Component UI · .tsx</text></g>
<g transform="translate(780 169)"><rect width="346" height="72" rx="10" class="panel"/><circle cx="24" cy="36" r="6" class="lime pulse"/><text x="46" y="33" class="label">PRODUCT SURFACE</text><text x="46" y="54" class="mono" fill="#eaf2f3" font-size="16">Character · chat · audio</text></g>

</svg>
