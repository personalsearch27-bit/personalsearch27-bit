name: GitHub Profile 3D Contribution City

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-3d-contrib/github-snake.svg?color_snake=#59e0c4&color_dots=#14232b,#173c43,#1d665f,#3aa896,#b6e36a
            profile-3d-contrib/github-snake-dark.svg?palette=github-dark&color_snake=#59e0c4&color_dots=#14232b,#173c43,#1d665f,#3aa896,#b6e36a
      - name: Commit generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No contribution image changes"
          else
            git commit -m "Update contribution skyline"
            git push
          fi

