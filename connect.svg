<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img">
<title>Connect with M. Abdullah and explore Shiya Companion</title>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#25404a" stroke-opacity=".16" stroke-width=".6"/></pattern>
</defs>
<rect width="1200" height="190" rx="20" fill="#09141b"/>
