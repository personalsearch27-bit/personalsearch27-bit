<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img">
<title>How Shiya Companion connects character, chat, and audio</title>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#25404a" stroke-opacity=".16" stroke-width=".6"/></pattern>
</defs>
<rect width="1200" height="260" rx="20" fill="#09141b"/>
<rect width="1200" height="260" rx="20" fill="url(#grid)"/>

<style>
  text { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
  .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
  .eyebrow { fill: #59e0c4; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .title { fill: #eaf2f3; font-size: 46px; font-weight: 700; letter-spacing: -1.2px; }
  .heading { fill: #eaf2f3; font-size: 24px; font-weight: 650; }
  .body { fill: #a1b3b9; font-size: 15px; }
  .label { fill: #a1b3b9; font-size: 11px; letter-spacing: 1.4px; }
  .chip { fill: #0d1b23; stroke: #25404a; stroke-width: 1; }
  .panel { fill: #10222b; stroke: #25404a; stroke-width: 1; }
  .teal { fill: #59e0c4; }
  .blue { fill: #69baff; }
  .lime { fill: #b6e36a; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
  .pulse-late { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
</style>


<g fill="none" stroke="#59e0c4" stroke-width="1" opacity=".22">
  <path d="M664 42L760 98L854 54L949 111L1068 58L1150 105"/>
  <path d="M664 42L684 174L782 225L854 54L880 207L949 111L1033 230L1068 58L1150 105L1140 224"/>
  <path d="M684 174L782 225L880 207L1033 230L1140 224"/>
</g>
<g fill="#59e0c4" opacity=".75">
  <circle cx="664" cy="42" r="3"/><circle cx="760" cy="98" r="2.5"/>
  <circle cx="854" cy="54" r="3.2" class="pulse"/><circle cx="949" cy="111" r="2.5"/>
  <circle cx="1068" cy="58" r="3" class="pulse-late"/><circle cx="1150" cy="105" r="2.5"/>
  <circle cx="684" cy="174" r="2.5"/><circle cx="782" cy="225" r="3"/>
  <circle cx="880" cy="207" r="2.5"/><circle cx="1033" cy="230" r="3.2" class="pulse"/>
  <circle cx="1140" cy="224" r="2.5"/>
</g>

<rect x="14" y="14" width="1172" height="232" rx="16" fill="none" stroke="#25404a" stroke-width="1"/>

<text x="48" y="54" class="eyebrow">SHIYA COMPANION · A CONNECTED INTERFACE</text>
<text x="48" y="91" class="heading">One project. Three interacting parts.</text>
<text x="48" y="121" class="body">Public TypeScript components connect character, conversation, and audio.</text>
<path d="M245 197H454M600 197H784M916 197H1040" stroke="#59e0c4" stroke-opacity=".55" stroke-width="1.5"/>
<circle cx="454" cy="197" r="4" class="teal pulse"/><circle cx="784" cy="197" r="4" class="teal pulse-late"/>
<g transform="translate(48 155)"><rect width="196" height="82" rx="10" class="panel"/><circle cx="22" cy="24" r="4" class="teal"/><text x="38" y="28" class="label">CHARACTER</text><text x="20" y="60" class="mono" fill="#eaf2f3" font-size="14">CharacterStage</text></g>
<g transform="translate(454 155)"><rect width="146" height="82" rx="10" class="panel"/><circle cx="22" cy="24" r="4" class="blue"/><text x="38" y="28" class="label">CONVERSATION</text><text x="20" y="60" class="mono" fill="#eaf2f3" font-size="14">ChatPanel</text></g>
<g transform="translate(784 155)"><rect width="176" height="82" rx="10" class="panel"/><circle cx="22" cy="24" r="4" class="lime"/><text x="38" y="28" class="label">AUDIO</text><text x="20" y="60" class="mono" fill="#eaf2f3" font-size="14">AudioVisualizer</text></g>
<g transform="translate(1040 169)"><circle cx="32" cy="28" r="25" fill="#0d1b23" stroke="#59e0c4"/><circle cx="32" cy="28" r="4" class="teal pulse"/><circle cx="32" cy="28" r="12" fill="none" stroke="#59e0c4" stroke-opacity=".4"/></g>

</svg>
